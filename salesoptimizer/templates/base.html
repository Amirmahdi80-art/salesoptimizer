<!DOCTYPE html>
{% load static %}
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}پورتال تحلیل کالای وب‌پوش{% endblock %}</title>
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'image/favicon.webp' %}">   
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <script defer src="{% static 'js/alpine.js' %}"></script>
    <script src="{% static 'js/xlsx.js' %}"></script>
    <script src="{% static 'js/jalaali.js' %}"></script>
    <style>
        @font-face {
        font-family: "Yekan";
        src: url("{% static './font/iran-yekan-400.eot' %}"); 
        src: url("{% static './font/iran-yekan-400.eot' %}?#iefix") format("embedded-opentype"),
        url("{% static './font/iran-yekan-400.ttf' %}") format("truetype"), 
        url("{% static './font/iran-yekan-400.woff' %}") format("woff"), 
        url("{% static './font/iran-yekan-400.woff2' %}") format("woff2"); 
        font-weight: normal;
        font-style: normal;
        }

        :root {
            /* page background */
            --bg: #0d0d0d;

            /* table surface stays light for readability */
            --surface: #ffffff;
            --surface-alt: #fafbfc;
            --surface-hover: #f0f4ff;

            /* borders + text inside table */
            --border: #e5e7eb;
            --text: #111827;
            --muted: #6b7280;

            /* brand */
            --primary: #10a37f;
            --primary-hover: #0e8f6f;

            /* dark UI chrome */
            --header-color: #ffffff;
            --chrome: rgba(255, 255, 255, 0.04);
            --chrome-border: rgba(255, 255, 255, 0.08);
            --chrome-hover: rgba(255, 255, 255, 0.08);
            --chrome-muted: #9ca3af;

            --radius: 12px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .3);
            --shadow-md: 0 10px 30px rgba(0, 0, 0, .45);
        }

        * { box-sizing: border-box; }

        [x-cloak] { display: none !important; }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(ellipse at top left, #1a1a2e, #0d0d0d);
            background-attachment: fixed;
            color: var(--header-color);
            font-family: "Yekan";
            font-size: 14px;
            -webkit-font-smoothing: antialiased;
        }

        .app {
            max-width: 1600px;
            margin: 0 auto;
            padding: 28px 24px 40px;
        }

        /* ---------- Header ---------- */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .header-left {
            display: flex;
            align-items: baseline;
            gap: 14px;
        }

        .header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.015em;
            background: linear-gradient(135deg, #10a37f, #4a9eff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            -webkit-text-fill-color: transparent;
        }

        .count {
            color: var(--chrome-muted);
            font-size: 13px;
            font-weight: 500;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search {
            display: flex;
            gap: 6px;
            align-items: center;
            background: var(--chrome);
            padding: 4px;
            border-radius: var(--radius);
            border: 1px solid var(--chrome-border);
            backdrop-filter: blur(6px);
        }

        .search input {
            border: none;
            outline: none;
            padding: 8px 10px;
            font-size: 14px;
            background: transparent;
            color: var(--header-color);
            width: 220px;
        }

        .search input::placeholder {
            color: var(--chrome-muted);
        }

        /* ---------- Buttons ---------- */
        .btn {
            border: 1px solid var(--chrome-border);
            border-radius: 10px;
            padding: 9px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color .15s, border-color .15s, color .15s,
                        box-shadow .15s, transform .05s;
            background: var(--chrome);
            color: var(--header-color);
            font-family: "Yekan";
        }

        .btn:hover:not(:disabled) {
            background: var(--chrome-hover);
            border-color: rgba(255, 255, 255, 0.16);
        }

        .btn:active:not(:disabled) {
            transform: translateY(1px);
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed;
        }

        .btn-primary {
            background: linear-gradient(135deg, #10a37f, #4a9eff);
            color: #fff;
            border-color: transparent;
            box-shadow: 0 4px 14px rgba(16, 163, 127, .25);
        }

        .btn-primary:hover:not(:disabled) {
            background: linear-gradient(135deg, #0e8f6f, #3a8eef);
            border-color: transparent;
            box-shadow: 0 6px 20px rgba(16, 163, 127, .35);
        }

        .btn-ghost {
            background: transparent;
            border-color: var(--chrome-border);
        }

        .btn-ghost:hover:not(:disabled) {
            background: var(--chrome-hover);
        }

        option {
            font-family: "Yekan";
        }
        /* ---------- Filters ---------- */
        .filters {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            background: var(--chrome);
            padding: 18px;
            border-radius: var(--radius);
            border: 1px solid var(--chrome-border);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
            backdrop-filter: blur(8px);
        }

        .filter {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .filter label {
            font-size: 11px;
            color: var(--chrome-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .filter input,
        .filter select {
            padding: 9px 11px;
            border-radius: 9px;
            border: 1px solid var(--chrome-border);
            background: rgba(255, 255, 255, 0.03);
            font-size: 13px;
            color: var(--header-color);
            outline: none;
            transition: border-color .15s, box-shadow .15s, background-color .15s;
            font-family: "Yekan";
        }

        .filter input::placeholder {
            color: var(--chrome-muted);
        }

        .filter select option {
            background: #1a1a2e;
            color: #ffffff;
        }

        .filter input:focus,
        .filter select:focus {
            border-color: var(--primary);
            background: rgba(16, 163, 127, 0.06);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, .15);
        }

        .filter-actions {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
        }

        /* ---------- Table ---------- */
        .table-wrap {
            background: #ffffff;
            border-radius: var(--radius);
            border: 1px solid #e2e8f0;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .table-scroll {
            overflow: auto;
            max-height: calc(100vh - 340px);
        }

        table {
            border-collapse: separate;
            border-spacing: 0;
            width: 100%;
            font-size: 13px;
            white-space: nowrap;
            color: #1e293b;
            background: #ffffff;
        }

        thead th {
            position: sticky !important;
            top: 0;
            z-index: 2;
            background: #f1f5f9;
            border-bottom: 1px solid #e2e8f0;
            padding: 11px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            color: #0f172a;
            cursor: pointer;
            user-select: none;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        thead th:hover {
            background: #e8eef5;
        }

        thead th.sorted {
            color: #0f172a;
            background: #e6f4ef;
            position: relative;
        }

        thead th.sorted::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: linear-gradient(90deg, #10a37f, #4a9eff);
        }

        .sort-ind {
            margin-left: 4px;
            font-size: 10px;
        }

        tbody td {
            padding: 9px 12px;
            border-bottom: 1px solid #e2e8f0;
            color: #1e293b;
            max-width: 260px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        tbody tr:nth-child(even) {
            background: #f8fafc;
        }

        tbody tr:hover {
            background: #ecfdf5;
        }

        td.num {
            text-align: right;
            color: #334155;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        td.tag {
            font-weight: 600;
            color: #0f172a;
        }

        td.state {
            text-align: center;
            padding: 48px 12px;
            color: #64748b;
            font-style: italic;
        }

        /* ---------- Pagination ---------- */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
            color: #1e293b;
        }

        .pagination .btn {
            background: #ffffff;
            color: #334155;
            border-color: #e2e8f0;
        }

        .pagination .btn:hover:not(:disabled) {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .page-info {
            font-size: 13px;
            color: #64748b;
            padding: 0 8px;
        }

        .page-info strong {
            color: #0f172a;
        }

        /* ---------- Table scrollbar (light surface) ---------- */
        .table-scroll::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.18);
            border-radius: 6px;
        }

        .table-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 0, 0, 0.28);
        }

        /* ============================================================
        RTL OVERRIDES
        Add dir="rtl" lang="fa" to <html>
        ============================================================ */

        [dir="rtl"] {
            font-family: "Yekan";
        }

        /* Page background ellipse should sit on the top-right in RTL */
        [dir="rtl"] html,
        [dir="rtl"] body,
        html[dir="rtl"],
        body[dir="rtl"] {
            background: radial-gradient(ellipse at top right, #1a1a2e, #0d0d0d);
            background-attachment: fixed;
        }

        /* Header: keep title on the right, actions on the left */
        [dir="rtl"] .header-left {
            flex-direction: row;
        }

        /* Filter actions row flips to the left side */
        [dir="rtl"] .filter-actions {
            justify-content: flex-start;
            align-items: flex-end;
        }

        /* Table text alignments */
        [dir="rtl"] table {
            text-align: right;
        }

        [dir="rtl"] thead th {
            text-align: right;
        }

        [dir="rtl"] td.num {
            text-align: left;               /* numbers stay LTR-aligned visually */
            font-variant-numeric: tabular-nums;
        }

        [dir="rtl"] td.state {
            text-align: center;
        }

        /* Sort indicator spacing flips */
        [dir="rtl"] .sort-ind {
            margin-left: 0;
            margin-right: 4px;
        }

        /* Search input: text flows RTL, but placeholder is still readable */
        [dir="rtl"] .search input {
            text-align: right;
        }

        /* Filter inputs: RTL text inside, but numeric input stays LTR-friendly */
        [dir="rtl"] .filter input {
            text-align: right;
        }

        [dir="rtl"] .filter input[type="text"] {
            direction: rtl;
        }

        /* Category code input specifically should be LTR (it's a numeric code) */
        [dir="rtl"] .filter input.code-input {
            direction: ltr;
            text-align: right;
        }

        /* Pagination: order of buttons mirrors naturally due to flex row-reverse
        — we don't need to reverse manually, browsers handle it with dir="rtl".
        But the "First/Last" visual positions can feel off, so we nudge: */
        [dir="rtl"] .pagination {
            flex-direction: row-reverse;
        }

        /* Ellipsis in cells should hug the correct side */
        [dir="rtl"] tbody td {
            text-overflow: ellipsis;
        }

        /* Scrollbar corner sits on the other side; nothing to do, but ensure
        the table-scroll is scrolled from the right by default */
        [dir="rtl"] .table-scroll {
            direction: rtl;
        }

        [dir="rtl"] .table-scroll table {
            direction: rtl;
        }

        tr.best-store-row > td {
            background: #fdf6e3;
            color: #473a13;
            font-weight: 500;
        }

        tr.best-store-row:hover > td {
            background: #faedc8;
        }

        /* ============================================================
        AI FAB + DRAWER
        ============================================================ */

        /* ---------- Floating action button ---------- */
        .ai-fab {
            position: fixed;
            bottom: 24px;
            left: 24px;                  /* RTL: bottom-left corner */
            z-index: 900;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: linear-gradient(135deg, #10a37f, #4a9eff);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(16, 163, 127, 0.35),
                        0 4px 10px rgba(0, 0, 0, 0.35);
            transition: transform .18s ease, box-shadow .18s ease, opacity .18s;
        }

        .ai-fab:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 36px rgba(16, 163, 127, 0.45),
                        0 6px 14px rgba(0, 0, 0, 0.4);
        }

        .ai-fab:active {
            transform: translateY(0);
        }

        .ai-fab-open {
            background: linear-gradient(135deg, #0e8f6f, #3a8eef);
        }

        /* ---------- Drawer ---------- */
        .ai-drawer {
            position: fixed;
            bottom: 0;
            left: 0;
            top: 0;
            width: min(480px, 100vw);
            z-index: 950;
            background: rgba(20, 20, 30, 0.96);
            border-inline-end: 1px solid var(--chrome-border);
            box-shadow: -20px 0 60px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            color: var(--header-color);
            display: flex;
            flex-direction: column;
            transform: translateX(-100%);
            transition: transform .25s ease;
            font-family: "Yekan_Medium", sans-serif;
        }

        .ai-drawer-open {
            transform: translateX(0);
        }

        .ai-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid var(--chrome-border);
            flex-shrink: 0;
        }

        .ai-drawer-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ai-drawer-title h2 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: -0.01em;
        }

        .ai-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10a37f;
            box-shadow: 0 0 0 4px rgba(16, 163, 127, 0.18);
            animation: ai-pulse 2s ease-in-out infinite;
        }

        @keyframes ai-pulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(16, 163, 127, 0.18); }
            50%      { box-shadow: 0 0 0 8px rgba(16, 163, 127, 0.05); }
        }

        .ai-drawer-close {
            background: transparent;
            border: 1px solid var(--chrome-border);
            color: var(--header-color);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color .15s, border-color .15s;
        }

        .ai-drawer-close:hover {
            background: var(--chrome-hover);
            border-color: rgba(255, 255, 255, 0.16);
        }

        /* ---------- Prompt editor ---------- */
        .ai-prompt {
            padding: 14px 18px;
            border-bottom: 1px solid var(--chrome-border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .ai-prompt-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--chrome-muted);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        .ai-prompt-hint {
            text-transform: none;
            letter-spacing: 0;
            font-weight: 500;
            color: var(--chrome-muted);
            font-size: 11px;
        }

        .ai-prompt-input {
            width: 100%;
            resize: vertical;
            min-height: 140px;
            max-height: 40vh;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid var(--chrome-border);
            background: rgba(255, 255, 255, 0.03);
            color: var(--header-color);
            font-family: inherit;
            font-size: 13px;
            line-height: 1.65;
            outline: none;
            direction: rtl;
            text-align: right;
            transition: border-color .15s, box-shadow .15s, background-color .15s;
        }

        .ai-prompt-input:focus {
            border-color: var(--primary);
            background: rgba(16, 163, 127, 0.06);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.15);
        }

        .ai-prompt-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* ---------- Chat ---------- */
        .ai-chat {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 16px 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        .ai-chat-empty {
            color: var(--chrome-muted);
            font-size: 13px;
            text-align: center;
            margin: auto;
            padding: 30px 20px;
            line-height: 1.8;
        }

        .ai-msg {
            display: flex;
            width: 100%;
        }

        .ai-msg-user {
            justify-content: flex-start;     /* user on the right in RTL = flex-start */
        }

        .ai-msg-assistant {
            justify-content: flex-end;       /* assistant on the left in RTL = flex-end */
        }

        .ai-msg-bubble {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13.5px;
            line-height: 1.85;
            word-break: break-word;
            position: relative;
        }

        .ai-msg-user .ai-msg-bubble {
            background: linear-gradient(135deg, #10a37f, #4a9eff);
            color: #ffffff;
            border-end-end-radius: 4px;
        }

        .ai-msg-assistant .ai-msg-bubble {
            background: rgba(255, 255, 255, 0.06);
            color: var(--header-color);
            border: 1px solid var(--chrome-border);
            border-end-start-radius: 4px;
        }

        .ai-msg-text {
            white-space: pre-wrap;
        }

        .ai-msg-text strong {
            font-weight: 700;
            color: #e6f4ef;
        }

        /* typing caret */
        .ai-caret {
            display: inline-block;
            width: 6px;
            height: 14px;
            background: #10a37f;
            margin-inline-start: 4px;
            vertical-align: text-bottom;
            animation: ai-blink 1s steps(2, start) infinite;
            border-radius: 1px;
        }

        @keyframes ai-blink {
            to { visibility: hidden; }
        }

        /* ---------- Responsive ---------- */
        @media (max-width: 720px) {
            .ai-fab {
                bottom: 16px;
                left: 16px;
                width: 50px;
                height: 50px;
            }

            .ai-drawer {
                width: 100vw;
                border-inline-end: none;
            }

            .ai-msg-bubble {
                max-width: 90%;
                font-size: 13px;
            }
        }
        /* Table cell link */
        .cell-link {
            color: #10a37f;
            font-weight: 600;
            text-decoration: none;
            border-bottom: 1px dashed transparent;
            transition: color .12s, border-color .12s;
            direction: ltr;
            font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        }

        .cell-link:hover {
            color: #0e8f6f;
            border-bottom-color: currentColor;
        }

        .cell-link:focus-visible {
            outline: 2px solid #10a37f;
            outline-offset: 2px;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="{% url 'analysis-grade-one-page' %}" class="brand">
                <span class="brand-mark" style="display: flex; justify-content: center; align-items: center;">IQ</span>
                <span class="brand-text">PRODUCT IQ | WEBPOOSH</span>
            </a>

            <ul class="nav-links">
                <li>
                    <a href="{% url 'store-analysis' %}" class="{% if request.resolver_match.url_name == 'store-analysis' %}active{% endif %}">
                        آنالیز فروشگاه برتر
                    </a>
                </li>
                <li>
                    <a href="{% url 'analysis-grade-one-page' %}" class="{% if request.resolver_match.url_name == 'analysis-grade-one-page' %}active{% endif %}">
                        آنالیز اقدامات محصولات
                    </a>
                </li>
                <li>
                    <a href="{% url 'actions-page' %}" class="{% if request.resolver_match.url_name == 'actions-page' %}active{% endif %}" class="{% if request.resolver_match.url_name == 'register-action' %}active{% endif %}">

                    </a>

            </ul>
        </div>

    {% block content %}{% endblock %}
    

    {% block extra_scripts %}{% endblock %}
</body>
</html>
